name: Feature Request
description: Suggest a new feature or improvement
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, or why is this needed?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: What should the end result look like from a user perspective?
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation details
      description: Any technical context, constraints, or suggestions for how to build this.
    validations:
      required: false
